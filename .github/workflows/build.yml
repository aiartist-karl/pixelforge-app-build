name: Build Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Fix Kotlin version
        run: |
          cd android
          echo "android.kotlinVersion=1.9.25" >> gradle.properties
          sed -i "s|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')|g" build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PixelForge-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install

      - name: Expo Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Fix node path and build settings
        run: |
          # Ensure Xcode build phase can find node
          NODE_PATH=$(which node)
          echo "Node path: $NODE_PATH"
          
          # Create .xcode.env.local to override node path
          cat > ios/.xcode.env.local << ENVEOF
          export NODE_BINARY=$NODE_PATH
          export ENTRY_FILE=index.js
          ENVEOF
          
          # Also set in .xcode.env
          cat > ios/.xcode.env << ENVEOF
          export NODE_BINARY=$NODE_PATH
          export ENTRY_FILE=index.js
          ENVEOF
          
          echo "=== .xcode.env ==="
          cat ios/.xcode.env
          echo "=== .xcode.env.local ==="
          cat ios/.xcode.env.local
          
          # Check if New Architecture is disabled in Podfile
          echo "=== Podfile new arch check ==="
          grep -i "new_arch\|RCT_NEW_ARCH" ios/Podfile || echo "(no new arch references found)"
          
          # Check generated AppDelegate moduleName
          echo "=== AppDelegate ==="
          for f in $(find ios -name "AppDelegate.mm" -o -name "AppDelegate.m" 2>/dev/null); do
            echo "--- $f ---"
            cat "$f"
          done

      - name: Build iOS
        run: |
          cd ios
          APP_NAME=$(node -e "console.log(require('../app.json').expo.name)")
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -type d | head -1)
          
          echo "=== Build Config ==="
          echo "Scheme: $APP_NAME | Workspace: $WORKSPACE"
          xcodebuild -version
          
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            2>&1 | tee /tmp/xcodebuild.log
          
          echo "=== xcodebuild exit code: $? ==="
          
          # Check for bundle step in log
          echo "=== Bundle step check ==="
          grep -i "bundle.*react.*native\|react-native bundle\|hermesc\|main.jsbundle" /tmp/xcodebuild.log | tail -20 || echo "(no bundle references in log)"

      - name: Verify and create IPA
        run: |
          APP_DIR=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          [ -z "$APP_DIR" ] && echo "Error: .app not found" && exit 1
          
          echo "App: $APP_DIR"
          echo "Size: $(du -sh "$APP_DIR" | cut -f1)"
          
          # Code signature check
          echo "=== Signature ==="
          codesign -dv "$APP_DIR" 2>&1 || echo "Unsigned"
          
          # Binary check
          BINARY="$APP_DIR/$(basename "$APP_DIR" .app)"
          echo "=== Binary ==="
          file "$BINARY" 2>/dev/null
          lipo -info "$BINARY" 2>/dev/null || true
          
          # JS bundle check - critical!
          echo "=== JS Bundle ==="
          BUNDLE="$APP_DIR/main.jsbundle"
          if [ -f "$BUNDLE" ]; then
            BUNDLE_SIZE=$(wc -c < "$BUNDLE")
            echo "Size: $BUNDLE_SIZE bytes"
            # Check first bytes - should be JS or Hermes bytecode
            echo "First 32 bytes hex:"
            xxd -l 32 "$BUNDLE"
            # Check if it looks like Hermes bytecode (starts with 0xC6 0x1F 0xD0)
            FIRST3=$(xxd -l 3 -p "$BUNDLE")
            if [ "$FIRST3" = "c61fd0" ]; then
              echo "Format: Hermes bytecode ✓"
            else
              echo "Format: JavaScript source (not compiled)"
            fi
          else
            echo "MISSING! This will cause crash on launch!"
            # Check if bundle exists elsewhere
            find ios/build -name "main.jsbundle" 2>/dev/null || echo "No main.jsbundle found anywhere"
            exit 1
          fi
          
          # Check for hermes bytecode files
          echo "=== Hermes files ==="
          find "$APP_DIR" -name "*.hbc" -o -name "hermes*" 2>/dev/null | head -10
          
          # Info.plist check
          echo "=== Info.plist ==="
          PLIST="$APP_DIR/Info.plist"
          if [ -f "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST"
            /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST"
            /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$PLIST"
            /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$PLIST" 2>/dev/null || echo "No LaunchStoryboard"
          else
            echo "Info.plist MISSING!"
          fi
          
          # Expo.plist check
          echo "=== Expo.plist ==="
          if [ -f "$APP_DIR/Expo.plist" ]; then
            /usr/libexec/PlistBuddy -c "Print" "$APP_DIR/Expo.plist"
          else
            echo "Expo.plist MISSING!"
          fi
          
          # Create IPA
          rm -rf /tmp/Payload
          mkdir -p /tmp/Payload
          cp -r "$APP_DIR" /tmp/Payload/
          cd /tmp && zip -r PixelForge-iOS.ipa Payload
          echo "IPA: $(ls -lh PixelForge-iOS.ipa | awk '{print $5}')"

      - uses: actions/upload-artifact@v4
        with:
          name: PixelForge-iOS-IPA
          path: /tmp/PixelForge-iOS.ipa
          retention-days: 30
