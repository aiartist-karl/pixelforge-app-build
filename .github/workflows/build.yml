name: Build Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Fix Kotlin version
        run: |
          cd android
          echo "android.kotlinVersion=1.9.25" >> gradle.properties
          sed -i "s|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')|g" build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PixelForge-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install

      - name: Expo Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Diagnose iOS project
        run: |
          echo "=== Entry files ==="
          ls -la index.js App.js .xcode.env 2>/dev/null
          echo "=== package.json main ==="
          node -e "console.log(require('./package.json').main)"
          echo "=== app.json name ==="
          node -e "console.log(require('./app.json').expo.name)"
          echo "=== iOS directory ==="
          ls -la ios/
          echo "=== Find .xcworkspace (directories only) ==="
          find ios/ -maxdepth 1 -name "*.xcworkspace" -type d
          echo "=== Find .xcodeproj (directories only) ==="
          find ios/ -maxdepth 1 -name "*.xcodeproj" -type d
          echo "=== List schemes ==="
          WORKSPACE=$(find ios/ -maxdepth 1 -name "*.xcworkspace" -type d | head -1)
          if [ -n "$WORKSPACE" ]; then
            echo "Workspace: $WORKSPACE"
            xcodebuild -list -workspace "$WORKSPACE"
          else
            echo "No .xcworkspace found!"
            PROJECT=$(find ios/ -maxdepth 1 -name "*.xcodeproj" -type d | head -1)
            if [ -n "$PROJECT" ]; then
              echo "Falling back to project: $PROJECT"
              xcodebuild -list -project "$PROJECT"
            fi
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS unsigned
        run: |
          cd ios
          # Find workspace or project
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -type d | head -1)
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -1)
          
          echo "Workspace: ${WORKSPACE:-none}"
          echo "Project: ${PROJECT:-none}"
          
          if [ -n "$WORKSPACE" ]; then
            # Get the first scheme from the workspace
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | sed -n '/Schemes:/,/^$/p' | grep -v "Schemes:" | grep -v "^$" | head -1 | xargs)
            echo "Scheme: $SCHEME"
            
            if [ -z "$SCHEME" ]; then
              echo "ERROR: No scheme found in workspace"
              xcodebuild -list -workspace "$WORKSPACE"
              exit 1
            fi
            
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              build
          elif [ -n "$PROJECT" ]; then
            SCHEME=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | sed -n '/Schemes:/,/^$/p' | grep -v "Schemes:" | grep -v "^$" | head -1 | xargs)
            echo "Scheme: $SCHEME"
            
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              build
          else
            echo "ERROR: No workspace or project found in ios/"
            ls -la
            exit 1
          fi

      - name: Verify JS bundle in app
        run: |
          APP_DIR=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: .app not found"
            find ios/build -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          echo "Found app: $APP_DIR"
          
          # Check JS bundle
          BUNDLE=$(find "$APP_DIR" -name "main.jsbundle" -o -name "index.bundle" -o -name "*.jsbundle" | head -1)
          if [ -n "$BUNDLE" ]; then
            echo "JS bundle found: $BUNDLE"
            ls -lh "$BUNDLE"
            echo "Bundle size: $(wc -c < "$BUNDLE") bytes"
          else
            echo "WARNING: No JS bundle found in app!"
            ls -la "$APP_DIR"
          fi
          
          echo "Total app size: $(du -sh "$APP_DIR" | cut -f1)"

      - name: Create unsigned IPA
        run: |
          APP_DIR=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          echo "Creating IPA from: $APP_DIR"
          mkdir -p /tmp/Payload
          cp -r "$APP_DIR" /tmp/Payload/
          cd /tmp
          zip -r PixelForge-iOS-unsigned.ipa Payload
          ls -lh PixelForge-iOS-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PixelForge-iOS-IPA
          path: /tmp/PixelForge-iOS-unsigned.ipa
          retention-days: 30
