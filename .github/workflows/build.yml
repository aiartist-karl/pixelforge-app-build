name: Build Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Fix Kotlin version
        run: |
          cd android
          echo "android.kotlinVersion=1.9.25" >> gradle.properties
          sed -i "s|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')|g" build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PixelForge-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install

      - name: Expo Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Verify entry file and .xcode.env
        run: |
          echo "=== Check entry files ==="
          ls -la index.js App.js
          echo "=== Check .xcode.env ==="
          cat .xcode.env
          echo "=== package.json main ==="
          node -e "console.log(require('./package.json').main)"
          echo "=== List Xcode schemes ==="
          cd ios && xcodebuild -list -workspace *.xcworkspace 2>/dev/null || echo "No workspace found"

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS unsigned
        run: |
          cd ios
          # Find the actual workspace and scheme
          WORKSPACE=$(ls *.xcworkspace 2>/dev/null | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A10 "Schemes:" | tail -n +2 | head -1 | xargs)
          
          if [ -z "$SCHEME" ]; then
            echo "Error: No scheme found"
            xcodebuild -list -workspace "$WORKSPACE"
            exit 1
          fi
          
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"
          
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify JS bundle in app
        run: |
          APP_DIR=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: .app not found"
            find ios/build -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          echo "Found app: $APP_DIR"
          
          # Check if JS bundle exists
          BUNDLE=$(find "$APP_DIR" -name "main.jsbundle" -o -name "index.bundle" -o -name "*.jsbundle" | head -1)
          if [ -n "$BUNDLE" ]; then
            echo "JS bundle found: $BUNDLE"
            ls -lh "$BUNDLE"
            echo "Bundle size: $(wc -c < "$BUNDLE") bytes"
          else
            echo "WARNING: No JS bundle found in app! App will crash on launch."
            ls -la "$APP_DIR"
          fi
          
          # Total app size
          echo "Total app size: $(du -sh "$APP_DIR" | cut -f1)"

      - name: Create unsigned IPA
        run: |
          APP_DIR=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          echo "Creating IPA from: $APP_DIR"
          mkdir -p /tmp/Payload
          cp -r "$APP_DIR" /tmp/Payload/
          cd /tmp
          zip -r PixelForge-iOS-unsigned.ipa Payload
          ls -lh PixelForge-iOS-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PixelForge-iOS-IPA
          path: /tmp/PixelForge-iOS-unsigned.ipa
          retention-days: 30
