name: Build Android APK & iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Fix Kotlin version
        run: |
          cd android
          echo "android.kotlinVersion=1.9.25" >> gradle.properties
          sed -i "s|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')|g" build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PixelForge-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install

      - name: Expo Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS
        run: |
          cd ios
          APP_NAME=$(node -e "console.log(require('../app.json').expo.name)")
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -type d | head -1)
          
          echo "=== Build Config ==="
          echo "Scheme: $APP_NAME | Workspace: $WORKSPACE"
          xcodebuild -version
          
          # Show generated native module name
          for f in $(find . -name "AppDelegate.mm" -o -name "AppDelegate.m" 2>/dev/null); do
            echo "--- $f moduleName ---"
            grep -i "moduleName" "$f" || echo "(not found)"
          done
          
          # Show Info.plist
          PLIST=$(find . -path "*/$APP_NAME/Info.plist" | head -1)
          [ -n "$PLIST" ] && /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" 2>/dev/null
          [ -n "$PLIST" ] && /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST" 2>/dev/null
          
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify and create IPA
        run: |
          APP_DIR=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          [ -z "$APP_DIR" ] && echo "Error: .app not found" && exit 1
          
          echo "App: $APP_DIR"
          echo "Size: $(du -sh "$APP_DIR" | cut -f1)"
          
          # Code signature check
          echo "=== Signature ==="
          codesign -dv "$APP_DIR" 2>&1 || echo "Unsigned"
          
          # Binary check
          BINARY="$APP_DIR/$(basename "$APP_DIR" .app)"
          echo "=== Binary ==="
          file "$BINARY" 2>/dev/null
          lipo -info "$BINARY" 2>/dev/null || true
          
          # JS bundle check
          BUNDLE="$APP_DIR/main.jsbundle"
          echo "=== JS Bundle ==="
          if [ -f "$BUNDLE" ]; then
            echo "Size: $(wc -c < "$BUNDLE") bytes"
            xxd -l 8 "$BUNDLE"
          else
            echo "MISSING!"
            exit 1
          fi
          
          # Expo.plist check
          echo "=== Expo.plist ==="
          [ -f "$APP_DIR/Expo.plist" ] && /usr/libexec/PlistBuddy -c "Print" "$APP_DIR/Expo.plist" 2>/dev/null || echo "MISSING"
          
          # Create IPA
          rm -rf /tmp/Payload
          mkdir -p /tmp/Payload
          cp -r "$APP_DIR" /tmp/Payload/
          cd /tmp && zip -r PixelForge-iOS.ipa Payload
          echo "IPA: $(ls -lh PixelForge-iOS.ipa | awk '{print $5}')"

      - uses: actions/upload-artifact@v4
        with:
          name: PixelForge-iOS-IPA
          path: /tmp/PixelForge-iOS.ipa
          retention-days: 30
